name: Auto PR to qa on PR Creation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Get PR details
        id: get_pr_details
        run: |
          # Get the PR title, PR branch name, and commit SHAs from the PR
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }} (QA)"
          commits=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" | jq -r '.[].sha')

          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "COMMITS=$commits" >> $GITHUB_ENV

      - name: Fetch all branches and commits
        run: |
          # Fetch all branches and commits to ensure we have the full history
          git fetch --all

      - name: Checkout qa branch
        run: |
          # Ensure we are on the qa branch (case-sensitive check)
          git fetch origin "qa"
          git checkout qa

      - name: Create a new branch from qa
        run: |
          # Create a new branch for this PR from the qa branch
          NEW_BRANCH="pr-to-qa-${{ github.event.pull_request.number }}"  # Dynamic name based on PR number
          git checkout -b $NEW_BRANCH

      - name: Cherry-pick commits from PR
        run: |
          # Cherry-pick each commit
          for commit in ${{ env.COMMITS }}
          do
            echo "Cherry-picking commit: $commit"
            git cherry-pick $commit || { 
              echo "Cherry-pick failed for commit $commit, aborting.";
              git cherry-pick --abort;
              exit 1;
            }
          done

      - name: Push changes to new branch on qa
        run: |
          # Push the new branch to the remote
          git push origin $NEW_BRANCH

      - name: Create Pull Request to qa
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch = process.env.NEW_BRANCH;   // The branch with cherry-picked commits
            const baseBranch = "qa";                    // Target branch (case-sensitive)
            const prTitle = process.env.PR_TITLE;      // PR title from the original PR

            // Check if a PR from the new branch to qa already exists
            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: "open"
            });

            if (existingPRs.length === 0) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle, // Use the original PR title for the new PR
                head: headBranch,
                base: baseBranch,
                body: `This PR was automatically created from a PR raised against develop. Original PR title: "${prTitle}".`
              });
              console.log(`✅ Created PR: ${response.data.html_url}`);
            } else {
              console.log("ℹ️ A PR from ${headBranch} to qa already exists.");
            }
