name: Auto PR to qa on Merge to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-qa:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Get PR details
        id: get_pr_details
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }} (QA)"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          commits=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" | jq -r '.[].sha')
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_BRANCH=$PR_BRANCH" >> $GITHUB_ENV
          echo "COMMITS=$commits" >> $GITHUB_ENV

      - name: Fetch all branches and commits
        run: git fetch --all

      - name: Checkout qa branch
        run: |
          git fetch origin qa
          git checkout qa

      - name: Create a new branch from qa using PR branch name
        run: |
          NEW_BRANCH="pr-to-qa-${{ env.PR_BRANCH }}"
          echo "NEW_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV
          git checkout -b $NEW_BRANCH

      - name: Cherry-pick commits from PR
        run: |
          for commit in ${{ env.COMMITS }}
          do
            echo "Cherry-picking commit: $commit"
            git cherry-pick $commit || {
              echo "Cherry-pick failed for commit $commit, aborting."
              git cherry-pick --abort
              exit 1
            }
          done

      - name: Push the new branch to the remote
        run: git push --set-upstream origin $NEW_BRANCH

      - name: Create Pull Request to qa
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch = process.env.NEW_BRANCH;
            const baseBranch = "qa";
            const prTitle = process.env.PR_TITLE;

            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: "open"
            });

            if (existingPRs.length === 0) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle,
                head: headBranch,
                base: baseBranch,
                body: `This PR was automatically created after merging a PR to develop. Original PR title: "${prTitle}".`
              });
              console.log(`✅ Created PR: ${response.data.html_url}`);
            } else {
              console.log(`ℹ️ A PR from ${headBranch} to qa already exists.`);
            }
