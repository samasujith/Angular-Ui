name: Auto PR to qa on Merge to Develop

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-qa:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Fetch full history
        run: git fetch --all

      - name: Identify merge commit
        id: identify_merge_commit
        run: |
          # Get the last commit SHA on develop (the merge commit)
          MERGE_COMMIT_SHA=$(git rev-parse origin/develop)
          PR_TITLE="${{ github.event.pull_request.title }} (QA)"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          echo "MERGE_COMMIT_SHA=$MERGE_COMMIT_SHA" >> $GITHUB_ENV
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_BRANCH=$PR_BRANCH" >> $GITHUB_ENV

      - name: Checkout qa branch
        run: |
          git checkout origin/qa -b qa

      - name: Create a new branch from qa
        run: |
          NEW_BRANCH="${{ env.PR_BRANCH }}-qa"
          echo "NEW_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV
          git checkout -b "$NEW_BRANCH"

      - name: Cherry-pick the merge commit
        run: |
          # Cherry-pick the merge commit using mainline strategy
          git cherry-pick -m 1 "${{ env.MERGE_COMMIT_SHA }}" || {
            echo "Cherry-pick failed. Aborting."
            git cherry-pick --abort
            exit 1
          }

      - name: Push new branch
        run: git push --set-upstream origin "${{ env.NEW_BRANCH }}"

      - name: Create Pull Request to qa
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch = process.env.NEW_BRANCH;
            const baseBranch = "qa";
            const prTitle = process.env.PR_TITLE;

            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: "open"
            });

            if (existingPRs.length === 0) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle,
                head: headBranch,
                base: baseBranch,
                body: `This PR was automatically created after merging a PR to develop. Original PR title: "${prTitle}".`
              });
              console.log(`✅ Created PR: ${response.data.html_url}`);
            } else {
              console.log(`ℹ️ A PR from ${headBranch} to ${baseBranch} already exists.`);
            }
