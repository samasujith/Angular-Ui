name: Create PR to QA on Merge to Develop

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

jobs:
  create-branch-and-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set PR variables
        id: vars
        run: |
          BRANCH_NAME="auto-qa-${{ github.event.pull_request.number }}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Create branch from QA and cherry-pick merge commit
        run: |
          git fetch origin QA
          git checkout -b ${{ env.BRANCH_NAME }} origin/QA

          MERGE_COMMIT_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          git fetch origin develop $MERGE_COMMIT_SHA

          git cherry-pick -X theirs $MERGE_COMMIT_SHA || {
            echo "Cherry-pick failed. Aborting..."
            git cherry-pick --abort
            exit 1
          }

      - name: Push branch
        run: git push origin ${{ env.BRANCH_NAME }}

      - name: Create Pull Request to QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { BRANCH_NAME, PR_TITLE } = process.env;
            const response = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto QA: ${PR_TITLE}`,
              head: BRANCH_NAME,
              base: "QA"
            });
            console.log(`Created PR: ${response.data.html_url}`);
