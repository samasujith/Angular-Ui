name: Auto PR to QA on Push to Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Create Pull Request to QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Check if an open PR already exists from develop to QA
            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:develop`,
              base: "QA",
              state: "open"
            });

            if (existingPRs.length === 0) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                title: "Auto PR: Merge develop into QA",
                head: "develop",
                base: "QA",
                body: "This pull request was automatically created to merge the latest changes from `develop` into `QA`."
              });
              console.log(`✅ Created PR: ${response.data.html_url}`);
            } else {
              console.log("ℹ️ A PR from develop to QA already exists.");
            }
