name: Auto PR to QA on PR Creation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Get PR details
        id: get_pr_details
        run: |
          # Get the PR title and commit SHAs from the PR
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          commits=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" | jq -r '.[].sha')

          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "COMMITS=$commits" >> $GITHUB_ENV

      - name: Create a new branch for QA
        run: |
          # Create a new branch from QA
          git fetch origin qa
          git checkout -b pr-to-qa origin/qa

      - name: Cherry-pick commits from PR
        run: |
          # Cherry-pick each commit
          for commit in ${{ env.COMMITS }}
          do
            git cherry-pick $commit || { echo "Cherry-pick failed, aborting."; git cherry-pick --abort; exit 1; }
          done

      - name: Push changes to new branch
        run: |
          # Push the new branch to the remote
          git push origin pr-to-qa

      - name: Create Pull Request to QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch = "pr-to-qa";   // The branch with cherry-picked commits
            const baseBranch = "qa";         // Target branch (update if yours is 'QA')
            const prTitle = process.env.PR_TITLE; // PR title from the original PR

            // Check if a PR from pr-to-qa to qa already exists
            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: "open"
            });

            if (existingPRs.length === 0) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle, // Use the original PR title for the new PR
                head: headBranch,
                base: baseBranch,
                body: `This PR was automatically created from a PR raised against develop. Original PR title: "${prTitle}".`
              });
              console.log(`✅ Created PR: ${response.data.html_url}`);
            } else {
              console.log("ℹ️ A PR from pr-to-qa to qa already exists.");
            }
